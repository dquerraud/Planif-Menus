<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recettes — Planificateur de repas familial</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container">
        <p class="eyebrow">Famille de 4</p>
        <h1>Recettes</h1>
        <div class="summary">
          <span>2 adultes</span>
          <span>2 adolescents</span>
          <span>Cookéo</span>
          <span>Plaques à induction</span>
          <span>Four</span>
        </div>
      </div>
    </header>

    <main class="container">
      <section id="sync-section" class="sync-section">
        <div class="sync-info">
          <span>Code de synchronisation :</span>
          <strong id="sync-code-display"></strong>
          <button id="copy-sync-code" type="button" class="secondary-button">Copier</button>
        </div>
        <div class="sync-actions">
          <input id="sync-code-input" type="text" placeholder="Coller le code d'un autre appareil" maxlength="8" />
          <button id="apply-sync-code" type="button" class="secondary-button">Utiliser sur cet appareil</button>
        </div>
        <p id="sync-status" class="sync-status"></p>
      </section>

      <section class="controls">
        <a id="back-to-planning" href="index.html" class="secondary-button">← Retour au planning</a>
      </section>

      <section id="saved-section" class="saved-section">
        <div class="saved-header">
          <h2>Mes propositions enregistrées</h2>
          <div class="saved-header-actions">
            <button id="add-custom-meal" type="button" class="primary-button">Ajouter un plat</button>
            <button id="clear-saved" type="button" class="secondary-button">Tout supprimer</button>
          </div>
        </div>
        <div id="saved-meals" class="saved-list"></div>
      </section>
    </main>

    <div id="recipe-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-content recipe-modal-content" role="dialog" aria-modal="true" aria-labelledby="recipe-title">
        <div class="modal-header">
          <h3 id="recipe-title">Fiche recette</h3>
          <button id="close-recipe-modal" type="button" class="close-button" aria-label="Fermer">×</button>
        </div>
        <div id="recipe-content"></div>
      </div>
    </div>

    <div id="custom-meal-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-content custom-meal-modal-content" role="dialog" aria-modal="true" aria-labelledby="custom-meal-title">
        <div class="modal-header">
          <h3 id="custom-meal-title">Ajouter un plat</h3>
          <button id="close-custom-meal-modal" type="button" class="close-button" aria-label="Fermer">×</button>
        </div>

        <form id="custom-meal-form">
          <div class="recipe-form-grid">
            <label>
              Nom du plat
              <input id="custom-dish" name="dish" type="text" maxlength="80" required />
            </label>
            <label>
              Matériel
              <input id="custom-equipment" name="equipment" type="text" maxlength="40" value="Matériel libre" />
            </label>
          </div>

          <div class="recipe-form-grid">
            <label>
              Catégorie
              <select id="custom-category" name="category">
                <option value="">Choisir une catégorie</option>
                <option value="Végé">Végé</option>
                <option value="Poisson">Poisson</option>
                <option value="Viande">Viande</option>
                <option value="Pizza/Quiches/Cake">Pizza/Quiches/Cake</option>
                <option value="Recettes sucrées">Recettes sucrées</option>
              </select>
            </label>
            <label>
              Temps
              <input id="custom-time" name="time" type="text" maxlength="30" value="30 min" />
            </label>
          </div>

          <label>
            Description
            <textarea id="custom-description" name="description" rows="3" maxlength="220"></textarea>
          </label>

          <div class="recipe-form-grid">
            <label>
              Nombre de personnes
              <input id="custom-people" name="people" type="number" min="1" max="20" value="4" />
            </label>
            <label>
              &nbsp;
              <span class="form-placeholder"> </span>
            </label>
          </div>

          <div class="recipe-form-columns">
            <label>
              Ingrédients
              <textarea id="custom-ingredients" name="ingredients" rows="8" placeholder="Un ingrédient par ligne" required></textarea>
            </label>
            <label>
              Préparation
              <textarea id="custom-steps" name="steps" rows="8" placeholder="Une étape par ligne" required></textarea>
            </label>
          </div>

          <div class="modal-actions">
            <button type="button" id="cancel-custom-meal" class="secondary-button">Annuler</button>
            <button type="submit" class="save-button">Enregistrer ce plat</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="sync.js"></script>
    <script src="saved-meals.js"></script>
  </body>
</html>
