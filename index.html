<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planificateur de repas familial</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container">
        <p class="eyebrow">Famille de 4</p>
        <h1>Planning repas de la semaine</h1>
        <div class="summary">
          <span>2 adultes</span>
          <span>2 adolescents</span>
          <span>Cookéo</span>
          <span>Plaques à induction</span>
          <span>Four</span>
        </div>
      </div>
    </header>

    <main class="container">
      <section id="sync-section" class="sync-section">
        <div class="sync-info">
          <span>Code de synchronisation :</span>
          <strong id="sync-code-display"></strong>
          <button id="copy-sync-code" type="button" class="secondary-button">Copier</button>
        </div>
        <div class="sync-actions">
          <input id="sync-code-input" type="text" placeholder="Coller le code d'un autre appareil" maxlength="8" />
          <button id="apply-sync-code" type="button" class="secondary-button">Utiliser sur cet appareil</button>
        </div>
        <p id="sync-status" class="sync-status"></p>
      </section>

      <section class="controls">
        <button id="generate-menu" type="button">Générer un menu</button>
        <a id="toggle-saved" href="recettes.html" class="secondary-button">Voir mes sauvegardes</a>
      </section>
      <section id="meal-plan" class="meal-plan" aria-live="polite"></section>
    </main>

    <div id="replace-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="replace-title">
        <div class="modal-header">
          <h3 id="replace-title">Remplacer le plat</h3>
          <button id="close-modal" type="button" class="close-button" aria-label="Fermer">×</button>
        </div>

        <label class="search-label" for="saved-search">Rechercher un plat enregistré</label>
        <input id="saved-search" type="text" placeholder="Tapez les premières lettres du titre" />

        <div id="replacement-list" class="replacement-list"></div>
      </div>
    </div>

    <div id="recipe-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-content recipe-modal-content" role="dialog" aria-modal="true" aria-labelledby="recipe-title">
        <div class="modal-header">
          <h3 id="recipe-title">Fiche recette</h3>
          <button id="close-recipe-modal" type="button" class="close-button" aria-label="Fermer">×</button>
        </div>
        <div id="recipe-content"></div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="sync.js"></script>
    <script src="saved-meals.js"></script>
    <script src="meal-agent.js"></script>
    <script src="app.js"></script>
  </body>
</html>
